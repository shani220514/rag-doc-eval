name: eval

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVAL_NO_DOTENV: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline tests
        run: python -m pytest tests/ -v --tb=short

      - name: Dry-run sync guard
        run: python scripts/kb_sync.py --dry-run

      - name: Fixture eval
        run: python scripts/eval_retrieve.py --fixture tests/fixtures/fake_retrieve.json
        env:
          EVAL_OUT_DIR: ${{ runner.temp }}/eval-out
